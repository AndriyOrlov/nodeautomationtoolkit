name: Build Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: "0.3.4"

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[windows]" pyinstaller

      - name: Run tests
        run: python -m pip install ".[dev,windows]" && python -m pytest

      - name: Smoke test Blueprint UI
        run: python scripts/windows_ui_smoke.py

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name NodeAutomationToolkit `
            --paths src `
            --collect-all NodeGraphQt `
            --collect-all PySide6 `
            --collect-all docx `
            --hidden-import nodeautomationtoolkit.builtin_nodes.files `
            --hidden-import nodeautomationtoolkit.builtin_nodes.text `
            --hidden-import nodeautomationtoolkit.builtin_nodes.text_analysis `
            --hidden-import nodeautomationtoolkit.builtin_nodes.recipient_mapping `
            --hidden-import nodeautomationtoolkit.builtin_nodes.logic `
            --hidden-import nodeautomationtoolkit.builtin_nodes.windows_dialogs `
            --hidden-import nodeautomationtoolkit.builtin_nodes.word `
            --hidden-import nodeautomationtoolkit.builtin_nodes.word_batch `
            --hidden-import nodeautomationtoolkit.builtin_nodes.output `
            --add-data "plugins;plugins" `
            --add-data "examples;examples" `
            src/nodeautomationtoolkit/__main__.py

      - name: Create ZIP
        shell: pwsh
        run: |
          $archive = "dist/NodeAutomationToolkit-v$env:RELEASE_VERSION-windows-x64.zip"
          Compress-Archive -Path dist/NodeAutomationToolkit/* -DestinationPath $archive
          python scripts/create_patch.py `
            --version $env:RELEASE_VERSION `
            --output "dist/NodeAutomationToolkit-v$env:RELEASE_VERSION.natpatch.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodeAutomationToolkit-v${{ env.RELEASE_VERSION }}-windows-x64
          path: dist/NodeAutomationToolkit-v${{ env.RELEASE_VERSION }}-windows-x64.zip

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodeAutomationToolkit-v${{ env.RELEASE_VERSION }}-patch
          path: dist/NodeAutomationToolkit-v${{ env.RELEASE_VERSION }}.natpatch.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $archive = "dist/NodeAutomationToolkit-$tag-windows-x64.zip"
          $patch = "dist/NodeAutomationToolkit-$tag.natpatch.zip"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $archive $patch --clobber
          } else {
            gh release create $tag `
              $archive `
              $patch `
              --target "${{ github.sha }}" `
              --title "Node Automation Toolkit $env:RELEASE_VERSION" `
              --notes-file RELEASE_NOTES.md `
              --prerelease
          }
