name: Build first Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[windows]" pyinstaller

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name NodeAutomationToolkit `
            --paths src `
            --collect-all NodeGraphQt `
            --collect-all PySide6 `
            --hidden-import nodeautomationtoolkit.builtin_nodes.files `
            --hidden-import nodeautomationtoolkit.builtin_nodes.text `
            --hidden-import nodeautomationtoolkit.builtin_nodes.logic `
            --hidden-import nodeautomationtoolkit.builtin_nodes.windows_dialogs `
            --add-data "plugins;plugins" `
            src/nodeautomationtoolkit/__main__.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/NodeAutomationToolkit/* `
            -DestinationPath dist/NodeAutomationToolkit-v0.1.0-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodeAutomationToolkit-v0.1.0-windows-x64
          path: dist/NodeAutomationToolkit-v0.1.0-windows-x64.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.1.0 2>$null) {
            gh release upload v0.1.0 dist/NodeAutomationToolkit-v0.1.0-windows-x64.zip --clobber
          } else {
            gh release create v0.1.0 `
              dist/NodeAutomationToolkit-v0.1.0-windows-x64.zip `
              --target "${{ github.sha }}" `
              --title "Node Automation Toolkit 0.1.0" `
              --notes-file RELEASE_NOTES.md `
              --prerelease
          }
