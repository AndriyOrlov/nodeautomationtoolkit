name: Build messages exe

# Один EXE програми повідомлень (build_messages_qt.bat) на Windows.
# Підпис: якщо в секретах репозиторію є NAT_SIGN_PFX_BASE64 (сертифікат .pfx
# у base64) і NAT_SIGN_PFX_PASSWORD — EXE підписується; інакше збирається без
# підпису (див. scripts/signing/README.md).

on:
  push:
    branches:
      - main
    paths:
      - build_messages_qt.bat
      - generate_messages_qt.py
      - src/nodeautomationtoolkit/generator_qt/messages_window.py
      - scripts/messages_exe/**
      - scripts/signing/**
      - .github/workflows/build-messages-exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[windows]" "pyinstaller>=6.10,<7"

      - name: Signing certificate from secrets
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.NAT_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "nat_sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            "NAT_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
            Write-Host "Certificate found: the exe will be signed."
          } else {
            Write-Host "::warning::No NAT_SIGN_PFX_BASE64 secret: the exe will NOT be signed."
          }

      - name: Build one exe
        shell: cmd
        env:
          NAT_SIGN_PFX_PASSWORD: ${{ secrets.NAT_SIGN_PFX_PASSWORD }}
        run: call build_messages_qt.bat

      - name: Check the exe
        shell: pwsh
        run: |
          $exe = "dist\PovidomlenniaKadrovi.exe"
          if (-not (Test-Path $exe)) { throw "No $exe" }
          $item = Get-Item $exe
          Write-Host ("Size: {0:N1} MB" -f ($item.Length / 1MB))
          Write-Host "Version: $($item.VersionInfo.FileVersion) - $($item.VersionInfo.FileDescription)"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          # Програма має стартувати й не впасти: чекаємо 20 с і закриваємо.
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath $exe -PassThru -WorkingDirectory "dist"
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "The exe exited on start with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Write-Host "Started and kept running for 20 s."

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PovidomlenniaKadrovi
          path: dist/PovidomlenniaKadrovi.exe
          if-no-files-found: error
