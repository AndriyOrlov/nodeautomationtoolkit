[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nodeautomationtoolkit"
version = "0.5.7"
description = "Local generator of order extracts, copies and ciphered messages"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrii Orlov" }]
dependencies = [
  "PySide6>=6.7,<7",
  "python-docx>=1.1,<2",
  "pillow>=10.0",
]

[project.optional-dependencies]
windows = [
  "pywin32>=306; platform_system == 'Windows'",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nodeautomationtoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
